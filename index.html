<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chinzillas Sin Filtro — Fanmeetings & Encuentros de Fans</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Chinzillas Sin Filtro</h1>
    <p>Comunidad Audiovisual & Encuentros de Fans</p>
  </header>

  <main class="container">
    <section class="section">
      <h2>Próximas Actividades y Encuentros</h2>
      <p class="section-desc">Únete a nuestras transmisiones virtuales en vivo o participa de nuestros encuentros presenciales.</p>
  
      <!-- BARRA DE FILTROS -->
      <div class="filter-bar">
        <button class="btn-filter active" data-filter="ALL">Todos los Eventos</button>
        <button class="btn-filter" data-filter="VIRTUAL">Solo Virtuales</button>
        <button class="btn-filter" data-filter="PRESENCIAL">Presenciales</button>
      </div>

      <!-- ORDENAMIENTO DE EVENTOS -->
      <div class="sorting-controls">
        <label for="select-sort">Ordenar por :</label>
        <select id="select-sort" class="select-control">
          <option value="DATE_ASC" selected>Fecha (Próximos primero)</option>
          <option value="DATE_DESC">Fecha (Más lejanos primero)</option>
          <option value="STATUS">Estado (Activos primero, Finalizados al final)</option>
        </select>
      </div>

      <!-- GRILLA DE EVENTOS -->
      <div id="meetups-container" class="meetups-grid"></div>

      <!-- CONTROLES DE PAGINACIÓN -->
      <div id="pagination-container" class="pagination-controls">
        <button id="btn-prev-page" class="btn-page" aria-label="Página anterior">&lt;</button>
        <span id="page-indicator" class="page-indicator">Página 1 de 1</span>
        <button id="btn-next-page" class="btn-page" aria-label="Página siguiente">&gt;</button>
      </div>
    </section>

    <section class="section">
      <h2>Inscribirse o Reservar Cupo</h2>
      <form id="reservation-form" class="form-card">
    
        <div class="form-group">
          <label for="select-event">Selecciona el Evento al que deseas asistir:</label>
          <select id="select-event" required>
            <option value="">-- Cargando eventos disponibles... --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="txt-name">Nombre Completo:</label>
          <input type="text" id="txt-name" placeholder="Ej. Yael..." required />
        </div>

        <div class="form-group">
          <label for="txt-email">Correo Electrónico:</label>
          <input type="email" id="txt-email" placeholder="usuario@correo.com" required />
        </div>

        <div class="form-group">
          <label for="num-attendees">Número de Cupos / Asistentes:</label>
          <input type="number" id="num-attendees" min="1" max="5" value="1" required />
        </div>

        <button type="submit" class="btn-submit">Confirmar Registro</button>
      </form>
      <div id="form-feedback" class="feedback-area"></div>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
